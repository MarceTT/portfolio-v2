<!doctype html>
<!--
  Source for the raster favicons derived from public/favicon.svg.
  The square corners are intentional for apple-touch-icon.png: iOS applies its own
  mask, so a pre-rounded icon would end up double-rounded.
  Regenerate with the commands documented in assets-src/README.md.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      .mark {
        font-size: 44cqw;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #ffffff;
        line-height: 1;
      }
    </style>
  </head>
  <body style="container-type: size">
    <span class="mark">MT</span>
  </body>
</html>
